services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: expensely
      POSTGRES_PASSWORD: expensely-local
      POSTGRES_DB: expensely
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensely -d expensely"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
